services:
  # VNC Server (Ubuntu)
  remote-desktop:
    image: nishanb/ck-x-simulator-remote-desktop:latest
    platform: linux/amd64
    build:
      context: ./remote-desktop
    hostname: terminal
    expose:
      - "5901" # VNC port (internal only)
      - "6901" # Web VNC port (internal only)
    environment:
      - VNC_PW=bakku-the-wizard
      - VNC_PASSWORD=bakku-the-wizard
      - VNC_VIEW_ONLY=false
      - VNC_RESOLUTION=1280x800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6901/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G # VSCodium (Electron) needs the extra headroom
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - ckx-network

  # Web Application (not directly exposed to users)
  webapp:
    image: nishanb/ck-x-simulator-webapp:latest
    build:
      context: ./app
    expose:
      - "3000" # Only exposed to internal network
    environment:
      - VNC_SERVICE_HOST=remote-desktop
      - VNC_SERVICE_PORT=6901
      - VNC_PASSWORD=bakku-the-wizard
      - SSH_HOST=remote-terminal
      - SSH_PORT=22
      - SSH_USER=candidate
      - SSH_PASSWORD=password
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Nginx Reverse Proxy - ONLY SERVICE EXPOSED TO USERS
  nginx:
    image: nishanb/ck-x-simulator-nginx:latest
    build:
      context: ./nginx
    depends_on:
      - webapp
      - remote-desktop
      - remote-terminal
      - facilitator
      - k8s-api-server
    ports:
      - "30080:80" # Expose Nginx on port 30080
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Jump Host (ckad9999 and ckad9988)
  jumphost:
    image: nishanb/ck-x-simulator-jumphost:latest
    build:
      context: ./jumphost
    hostname: ckad9999
    privileged: true
    # No external port mappings - only accessible internally
    expose:
      - "22" # SSH port (internal only)
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
      - exam-assets:/tmp/exam-assets # Shared exam assets (scripts) across all servers
    deploy:
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      ckx-network:
        aliases:
          - ckad9999 # explicit DNS alias so `ssh ckad9999` resolves from any container
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Additional exam servers (fixed pool). These reuse the jumphost image and let
  # multi-server exams route each question to a different SSH server. Exams that
  # only use ckad9999 leave these idle. Each shares the kubeconfig (all cluster
  # contexts) and the exam-assets volume so setup/validation scripts are present.
  jumphost-2:
    image: nishanb/ck-x-simulator-jumphost:latest
    build:
      context: ./jumphost
    hostname: ckad9988
    privileged: true
    expose:
      - "22"
    volumes:
      - kube-config:/home/candidate/.kube
      - exam-assets:/tmp/exam-assets
    deploy:
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      ckx-network:
        aliases:
          - ckad9988
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  jumphost-3:
    image: nishanb/ck-x-simulator-jumphost:latest
    build:
      context: ./jumphost
    hostname: ckad9977
    privileged: true
    expose:
      - "22"
    volumes:
      - kube-config:/home/candidate/.kube
      - exam-assets:/tmp/exam-assets
    deploy:
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      ckx-network:
        aliases:
          - ckad9977
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Resets the exam jumphosts (ckad9999 / ckad9988 / ckad9977) to a pristine
  # state when a session is terminated, by recreating their containers from the
  # image: every file and system change from the session is discarded, named
  # volumes are kept. Internal only (no ports published); it holds the Docker
  # socket and only ever recreates the services listed in RESET_SERVICES.
  resetter:
    image: ck-x-simulator-resetter:latest
    pull_policy: build
    build:
      context: ./resetter
    environment:
      - RESET_SERVICES=jumphost,jumphost-2,jumphost-3
    volumes:
      # Rootless Docker: set DOCKER_SOCKET to your socket path, e.g. $XDG_RUNTIME_DIR/docker.sock
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    expose:
      - "3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    networks:
      - ckx-network

  # Remote Terminal Service
  remote-terminal:
    image: nishanb/ck-x-simulator-remote-terminal:latest
    build:
      context: ./remote-terminal
    hostname: remote-terminal
    expose:
      - "22" # SSH port (internal only)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # KIND Kubernetes Cluster
  k8s-api-server: # Service name that will be used for DNS resolution
    image: nishanb/ck-x-simulator-cluster:latest
    build:
      context: ./kind-cluster
    container_name: kind-cluster
    hostname: k8s-api-server
    privileged: true # Required for running containers inside KIND
    expose:
      - "6443" # cluster #1 API (index 0)
      - "6444" # cluster #2 API (index 1) — multi-cluster exams
      - "6445" # cluster #3 API (index 2) — multi-cluster exams
      - "22"
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G # multi-cluster exams run up to 3 k3d clusters here
        reservations:
          cpus: "1"
          memory: 3G
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "ls", "/ready"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Redis Database for Facilitator
  redis:
    image: redis:alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Facilitator Service
  facilitator:
    image: nishanb/ck-x-simulator-facilitator:latest
    build:
      context: ./facilitator
      dockerfile: Dockerfile
    hostname: facilitator
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=prod
      - SSH_HOST=jumphost
      - SSH_PORT=22
      - SSH_USERNAME=candidate
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TRACK_METRICS=true # based on the environment variable TRACK_METRICS, the facilitator will send metrics to the metric server
      - RESETTER_URL=http://resetter:3000 # resets the jumphosts when a session is terminated
    restart: unless-stopped
    depends_on:
      - jumphost
      - redis
      - resetter
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ckx-network:
    name: ckx-network
    driver: bridge

volumes:
  kube-config: # Shared volume for Kubernetes configuration
  exam-assets: # Shared volume so every exam server sees the unpacked setup/validation scripts
